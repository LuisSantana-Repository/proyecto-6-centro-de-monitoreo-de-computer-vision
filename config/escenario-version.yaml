# Escenario S2 · Cambio de versión del modelo no declarado.
# Hereda TODO de monitor.yaml (modelo esperado yolo11n, política de confianza, ventanas, reglas, captura)
# y solo agrega:
#   - el artefacto que el "despliegue" pone en su lugar (identidad resoluble y verificable por SHA-256);
#   - la regla de versión y la reacción en las ventanas.
# El modelo esperado sigue siendo el de `model` (yolo11n). monitor.yaml (cfg-0b5e664b118c) no cambia.
base: monitor.yaml

# Artefactos que pueden aparecer en los eventos sin ser el configurado. --swap-model los usa por nombre.
model_alternatives:
  yolo11s:
    weights: modelo/yolo11s.pt
    url: https://github.com/ultralytics/assets/releases/download/v8.3.0/yolo11s.pt
    sha256: 85a76fe86dd8afe384648546b56a7a78580c7cb7b404fc595f97969322d502d5

model_version:
  rule_id: version-modelo-v1
  consecutive_mismatch: 3       # 3 eventos inferidos seguidos con un model_ref distinto del esperado abren la alerta
  recover_after_match: 3        # 3 eventos seguidos con la versión esperada la resuelven
  severity: critical
  # Reacción: una ventana con algún evento de otra versión queda "otra_version": no se compara con la
  # referencia ni con los umbrales (se derivaron con yolo11n), y no suma ni rompe rachas de las reglas.
  exclude_windows: true
  suggested_action: >-
    Revisar el despliegue: los eventos reportan un modelo distinto del configurado. Confirmar qué
    artefacto se cargó (model_ref y SHA-256 en los eventos) y regresar a la versión esperada o
    actualizar la configuración y la referencia. Mientras tanto, las ventanas afectadas quedan
    "otra_version" y sus umbrales de confianza no se interpretan.
