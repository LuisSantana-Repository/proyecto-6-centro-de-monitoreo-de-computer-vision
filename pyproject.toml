[project]
name = "monitor-cv-p6"
version = "0.1.0"
description = "Proyecto 6: Centro de monitoreo de computer vision (ITESO MLOps). Centro de monitoreo de computer vision sobre la cámara en vivo del cruce de Shibuya."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "ultralytics>=8.3,<9",
    "opencv-python>=4.10,<5",
    "yt-dlp>=2025.1.1",
    "psutil>=6,<8",
    "pydantic>=2.7,<3",
    "pyyaml>=6,<7",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "jinja2>=3.1,<4",
]

[dependency-groups]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monitor"]
