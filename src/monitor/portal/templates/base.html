<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Centro de monitoreo{% endblock %} · Proyecto 6</title>
<style>
  :root { --azul:#003c71; --tinta:#1f2d3a; --muted:#5b6b79; --borde:#dce5ec; --fondo:#f4f7fa;
          --ok:#1e7a3c; --duda:#c26a00; --baja:#b3261e; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 system-ui, "Segoe UI", sans-serif; color:var(--tinta); background:var(--fondo); }
  header { background:var(--azul); color:#fff; padding:10px 20px; display:flex; gap:24px; align-items:center; flex-wrap:wrap; }
  header b { font-size:15px; }
  header a { color:#cfe4f5; text-decoration:none; font-weight:600; }
  header a.on, header a:hover { color:#fff; text-decoration:underline; }
  main { padding:18px 20px 40px; max-width:1400px; margin:auto; }
  h1 { font-size:20px; margin:4px 0 14px; color:var(--azul); }
  h2 { font-size:16px; margin:22px 0 8px; color:var(--azul); }
  a { color:#0067a5; }
  .card { background:#fff; border:1px solid var(--borde); border-radius:10px; padding:14px 16px; margin-bottom:14px; }
  table { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--borde); }
  th, td { padding:6px 8px; border-bottom:1px solid var(--borde); text-align:left; vertical-align:top; font-size:13px; }
  th { background:#eaf1f7; color:var(--azul); font-weight:700; position:sticky; top:0; }
  tr:hover td { background:#f8fbfd; }
  .num { text-align:right; font-variant-numeric:tabular-nums; }
  .mono { font-family:Consolas, monospace; font-size:12px; }
  form.filters { display:flex; gap:10px; flex-wrap:wrap; align-items:end; }
  form.filters label { display:flex; flex-direction:column; font-size:12px; color:var(--muted); font-weight:600; }
  input, select, button { font:inherit; padding:5px 8px; border:1px solid #c8d6e1; border-radius:6px; background:#fff; }
  button { background:var(--azul); color:#fff; border-color:var(--azul); cursor:pointer; }
  .badge { display:inline-block; padding:1px 7px; border-radius:99px; font-size:12px; font-weight:700; }
  .z-accepted { background:#e0f5ea; color:var(--ok); }
  .z-doubt { background:#fff0df; color:var(--duda); }
  .z-low { background:#fde8e6; color:var(--baja); }
  .s-ok { background:#e0f5ea; color:var(--ok); }
  .s-no_detections { background:#eef2f6; color:var(--muted); }
  .s-inference_error, .s-invalid_input, .sev-critical { background:#fde8e6; color:var(--baja); }
  .sev-warning { background:#fff0df; color:var(--duda); }
  .sev-info { background:#e6f0fa; color:#0067a5; }
  .grid { display:grid; grid-template-columns:minmax(0, 2fr) minmax(280px, 1fr); gap:16px; }
  @media (max-width:900px) { .grid { grid-template-columns:1fr; } }
  dl { display:grid; grid-template-columns:max-content 1fr; gap:4px 14px; margin:0; }
  dt { color:var(--muted); font-weight:600; }
  dd { margin:0; overflow-wrap:anywhere; }
  img.frame { width:100%; border-radius:8px; border:1px solid var(--borde); }
  img.thumb { width:120px; border-radius:4px; }
  .pager { margin:10px 0; display:flex; gap:12px; align-items:center; }
  .muted { color:var(--muted); }
  pre { background:#fff; border:1px solid var(--borde); border-radius:8px; padding:12px; overflow:auto; font-size:12px; }
  .empty { padding:24px; text-align:center; color:var(--muted); background:#fff; border:1px dashed var(--borde); border-radius:10px; }
  .chart { margin:0 0 20px; padding:12px 14px; background:#fcfcfb; border:1px solid var(--borde); border-radius:10px; }
  .chart figcaption { margin-bottom:6px; }
  .chart .hit:hover { fill:rgba(11,11,11,0.05); }
  .chart-key { font-size:12px; margin:4px 0 0; }
  h3 { font-size:14px; margin:14px 0 6px; color:var(--azul); }
  .small { font-size:12px; }
  .flash { padding:10px 14px; border-radius:8px; margin:0 0 14px; border:1px solid; }
  .flash.ok { background:#e0f5ea; border-color:#b6e2c6; color:var(--ok); }
  .flash.err { background:#fde8e6; border-color:#f3c1bc; color:var(--baja); }
  form.review { display:flex; flex-direction:column; gap:8px; margin-top:10px; }
  form.review label { display:flex; flex-direction:column; font-size:12px; color:var(--muted); font-weight:600; gap:2px; }
  form.review textarea { font:inherit; padding:5px 8px; border:1px solid #c8d6e1; border-radius:6px; }
  form.review button { align-self:flex-start; }
  button.secondary { background:#fff; color:var(--azul); }
  dl.tight { margin-top:8px; }
  table.hist td, table.hist th { font-size:12px; }
  .rv-pendiente { background:#fff0df; color:var(--duda); }
  .rv-reconocida { background:#e6f0fa; color:#0067a5; }
  .rv-revisada, .rv-done { background:#e0f5ea; color:var(--ok); }
  .qgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:12px; }
  .qitem { background:#fff; border:1px solid var(--borde); border-radius:8px; padding:8px; font-size:12px; }
  .qitem img { width:100%; border-radius:4px; display:block; margin-bottom:6px; }
  .vivo-en_curso { background:#e0f5ea; border-color:#b6e2c6; color:var(--ok); }
  .vivo-fuente_caida, .vivo-estancada { background:#fde8e6; border-color:#f3c1bc; color:var(--baja); }
  .vivo-terminada { background:#eef2f6; border-color:var(--borde); color:var(--muted); }
  progress { vertical-align:middle; width:140px; }
</style>
</head>
<body>
<header>
  <b>Proyecto 6 · Centro de monitoreo</b>
  {% set p = request.url.path %}
  <a href="/vivo" class="{{ 'on' if p.startswith('/vivo') }}">En vivo</a>
  <a href="/eventos" class="{{ 'on' if p.startswith('/eventos') }}">Eventos</a>
  <a href="/alertas" class="{{ 'on' if p.startswith('/alertas') }}">Alertas</a>
  <a href="/runs" class="{{ 'on' if p.startswith('/runs') }}">Ejecuciones</a>
  <a href="/graficas" class="{{ 'on' if p.startswith('/graficas') }}">Gráficas</a>
  <a href="/revision" class="{{ 'on' if p.startswith('/revision') }}">Revisión</a>
  <a href="/exportar" class="{{ 'on' if p.startswith('/exportar') }}">Exportar</a>
  <a href="/docs">API</a>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
